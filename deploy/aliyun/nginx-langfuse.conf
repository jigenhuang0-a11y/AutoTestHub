# ============================================================
# AI 测试平台 — 阿里云 Nginx 反代配置
# 放在宿主机的 /etc/nginx/conf.d/platform.conf
# 作用：用 80 端口统一对外，按路径分流到各容器服务
#   /            -> 前端 (harness-frontend:80)
#   /api/        -> 编排后端 (ai-orchestrator:8001)
#   /langfuse/   -> Langfuse 可观测平台 (langfuse:3000)
# ============================================================

# ---------- Langfuse ----------
# Langfuse 原生不支持子路径，这里用子域名更稳；若只用 IP，可改用 /langfuse/ 并加 BASE_PATH
# 推荐：用子域名 langfuse.your-domain.com
server {
    listen 80;
    server_name langfuse.your-domain.com;   # ← 改成你的域名

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Langfuse 使用 SSE/WebSocket 时需以下两项
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------- 主站（前端 + API）----------
server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名或 ECS 公网 IP

    client_max_body_size 50m;

    # 前端静态资源
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
