services:
  ai-orchestration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-orchestration-service
    ports:
      - "8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - GLM_API_KEY=${GLM_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - ai-test-platform

networks:
  ai-test-platform:
    external: true
