server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 知识库流式接口 rewrite（开发环境 Vite 用 /api/knowledge，生产 nginx 重写成 /api/v1/knowledge）
    location /api/knowledge/ {
        rewrite ^/api/knowledge/(.*)$ /api/v1/knowledge/$1 break;
        proxy_pass http://ai-orchestrator:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 代理到底座后端（保留 /api/v1 前缀，FastAPI 路由以 /api/v1 注册）
    location /api/ {
        proxy_pass http://ai-orchestrator:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端路由（History 模式）
    location / {
        # index.html 必须禁止缓存，否则浏览器会用缓存中的旧入口指向旧 JS bundle
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
