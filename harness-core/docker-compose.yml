version: "3.8"

# Agent Harness 中台依赖三件套：MySQL + Redis + Milvus
# 彻底方案：用 MySQL 替代 Postgres，Redis 替代 Celery broker，Milvus 做向量
services:
  mysql:
    image: mysql:8.0
    container_name: harness-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-harness_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-harness_core}
      MYSQL_USER: ${MYSQL_USER:-harness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-harness_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: harness-etcd
    restart: unless-stopped
    environment:
      ETCD_ENABLE_V2: "true"
      ETCD_DATA_DIR: /etcd-data
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: default=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd_data:/etcd-data

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: harness-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: harness-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
