# ============================================
# K8s: Milvus 2.4 向量数据库
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: ai-test-platform
  labels:
    app: milvus
    app.kubernetes.io/name: milvus
spec:
  type: ClusterIP
  ports:
    - port: 19530
      targetPort: 19530
      name: grpc
    - port: 9091
      targetPort: 9091
      name: health
  selector:
    app: milvus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: ai-test-platform
  labels:
    app: milvus
    app.kubernetes.io/name: milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.0
          command:
            - milvus
            - run
            - standalone
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: health
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            - name: MINIO_ADDRESS
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ai-test-platform-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-test-platform-secrets
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: milvus-data
          persistentVolumeClaim:
            claimName: milvus-data
