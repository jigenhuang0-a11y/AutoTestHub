# ============================================
# K8s Secrets: 敏感信息（API Keys、密码）
# ⚠️  生产环境请用 External Secrets Operator 或 Vault
#     不要将真实值提交到 Git！
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-platform-secrets
  namespace: ai-test-platform
  labels:
    app.kubernetes.io/name: ai-test-platform
type: Opaque
stringData:
  # Django（必须更换）
  SECRET_KEY: "CHANGE-ME-IN-PRODUCTION-50-CHAR-MINIMUM"
  DB_PASSWORD: "CHANGE-ME-DB-PASSWORD"

  # MinIO（必须更换）
  MINIO_ACCESS_KEY: "CHANGE-ME-MINIO-ACCESS-KEY"
  MINIO_SECRET_KEY: "CHANGE-ME-MINIO-SECRET-KEY"

  # LLM API Keys（生产环境通过 External Secrets Operator 注入）
  DASHSCOPE_API_KEY: "your-dashscope-key"
  DEEPSEEK_API_KEY: "your-deepseek-key"
  GLM_API_KEY: "your-glm-key"

  # Midscene AI
  MIDSCENE_AI_API_KEY: "your-midscene-key"
  MIDSCENE_AI_BASE_URL: "https://your-instance.maas.aliyuncs.com/compatible-mode"
