# ============================================
# K8s PVCs: 持久化存储声明
# ============================================
# 生产环境建议使用 StorageClass 动态供应（如 AWS EBS / 阿里云云盘）
# 本地开发可用 hostPath 或 local-path-provisioner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-test-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
