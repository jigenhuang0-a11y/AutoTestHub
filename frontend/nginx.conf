# ============================================
# Nginx 配置 - 前端静态资源 + API 反向代理
# ============================================
# 面试话术："Nginx 做两件事：1)托管前端静态文件 2)把 /api/ 请求代理到后端 Django"
# "这样前后端同域名，不需要 CORS 配置，更安全"
# ============================================

server {
    listen 80;
    server_name localhost;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Vue Router history 模式必须配置：找不到文件时返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # ==================== SSE 流式端点（必须关闭缓冲） ====================
    # 编排服务工作流流式执行
    location /api/v1/workflow/stream {
        proxy_pass http://ai-orchestrator:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }

    # 编排服务断点续跑（也是 SSE 流式）
    location /api/v1/workflow/resume {
        proxy_pass http://ai-orchestrator:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }

    # 编排服务其他 API
    location /api/v1/ {
        proxy_pass http://ai-orchestrator:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Prometheus Metrics（编排服务暴露）
    location /metrics {
        proxy_pass http://ai-orchestrator:8001/metrics;
        proxy_set_header Host $host;
    }

    # ==================== Django API（非 /api/v1/ 的请求） ====================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置（AI 接口响应可能较慢）
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Allure 报告静态资源
    location /allure/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 静态文件缓存（7天）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
